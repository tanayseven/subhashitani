<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}सुभाषितानि{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="fork-me-wrapper fork-me-fixed">
    <div class="fork-me">
      <a class="fork-me-link" href="https://github.com/tanayseven/subhashitani" target="_blank" rel="noopener">
        <span class="fork-me-text">Fork Me On GitHub</span>
      </a>
    </div>
  </div>
  <header>
    <nav>
      <a class="site-title" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" class="site-logo">
        सुभाषितानि
      </a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>सुभाषितानि &mdash; Sanskrit sayings and their translations</p>
    <p>Made with <span title="love">❤️</span> and <span title="a lot of sweat">😅</span> by <a href="https://blog.tanay.tech" target="_blank" rel="noopener">Tanay PrabhuDesai</a></p>
  </footer>
  <script>
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    const stored = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = stored ? stored === 'dark' : prefersDark;
    if (isDark) root.dataset.theme = 'dark';
    btn.textContent = isDark ? '☀️' : '🌙';
    btn.addEventListener('click', () => {
      const dark = root.dataset.theme !== 'dark';
      root.dataset.theme = dark ? 'dark' : 'light';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      btn.textContent = dark ? '☀️' : '🌙';
    });
  </script>
</body>
</html>
