[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subhashitani"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.1",
    "frozen-flask==1.0.2",
    "python-frontmatter==1.1.0",
    "markdown==3.8",
    "pydantic>=2.13.4",
]

[project.scripts]
build = "app:freeze"
serve = "app:serve"

[tool.hatch.build.targets.wheel]
include = ["app.py", "shlokas.py", "templates", "static"]
